name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the configured Apple signing identity
        run: |
          if [[ -z "$SIGNING_IDENTITY" || "$SIGNING_IDENTITY" == "-" ]]; then
            echo "Set MACOS_SIGNING_IDENTITY to the Apple-issued identity installed on this runner."
            exit 1
          fi
      - name: Build and test universal binary
        run: |
          make test
          make clean
          make ARCH_FLAGS="-arch arm64 -arch x86_64" STATUS_ARCHS="arm64 x86_64" VERSION="${GITHUB_REF_NAME#v}" SIGNING_IDENTITY="$SIGNING_IDENTITY"
          lipo -archs build/horndis | grep -q arm64
          lipo -archs build/horndis | grep -q x86_64
          lipo -archs build/horndis-status | grep -q arm64
          lipo -archs build/horndis-status | grep -q x86_64
          python3 Scripts/verify-release-signing.py build
          file build/horndis
          file build/horndis-status
      - name: Package
        run: |
          mkdir -p dist/horndis
          cp build/horndis README.md README.zh-CN.md LICENSE dist/horndis/
          cp -R -X build/HoRNDISStatus.app dist/horndis/
          cp -R Documentation dist/horndis/
          cp -R docs dist/horndis/
          ditto -c -k --keepParent dist/horndis "dist/horndis-${GITHUB_REF_NAME}-macos-universal.zip"

          Scripts/build-package "${GITHUB_REF_NAME#v}" \
            "dist/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg"
          python3 Scripts/generate-homebrew-cask.py \
            --version "${GITHUB_REF_NAME#v}" \
            --package "dist/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg" \
            --output dist/horndis.rb
          ! pkgutil --payload-files \
            "dist/HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg" \
            | grep -Eq '(^|/)\._'

          (
            cd dist
            shasum -a 256 "horndis-${GITHUB_REF_NAME}-macos-universal.zip" > "horndis-${GITHUB_REF_NAME}-macos-universal.zip.sha256"
            shasum -a 256 "HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg" > "HoRNDIS-Userspace-${GITHUB_REF_NAME}-macos-universal.pkg.sha256"
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; retaining its published assets and checksums."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/*.zip dist/*.sha256 dist/horndis.rb --generate-notes
          fi
